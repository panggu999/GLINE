<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G-Line</title>
    <meta name="description" content="G-Line · 每日事项工具 · macOS 通用安装包 · Windows 64 位" />
    <link rel="icon" href="./icon.png" type="image/png" />
    <style>
      :root {
        --bg: #111111;
        --ink: #f5f5f5;
        --muted: #8e8e8e;
        --line: #2a2a2a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", "Hiragino Sans GB", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 56px 32px;
      }
      main {
        width: min(1200px, 100%);
        margin: auto;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin: 0 0 36px;
        text-align: left;
      }
      .logo {
        display: block;
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }
      .brand-copy {
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
          "Songti SC", serif;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .lead {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        font-weight: 400;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        margin: 0 0 36px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stats b {
        display: block;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .stats span {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      a.btn {
        display: block;
        text-decoration: none;
        background: #f5f5f5;
        color: #111;
        border-radius: 10px;
        padding: 13px 18px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: opacity 0.15s ease;
      }
      a.btn:hover {
        opacity: 0.82;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      .btn-row a.btn {
        flex: 1;
      }
      a.btn-win {
        background: transparent;
        color: #f5f5f5;
        box-shadow: inset 0 0 0 1px #3a3a3a;
      }
      .gate {
        margin: 16px 0 0;
        text-align: left;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        font-weight: 400;
      }
      .changelog {
        margin-top: 36px;
        text-align: left;
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }
      .changelog h2.cl-title {
        margin: 0 0 18px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      #cl-list {
        columns: 2;
        column-gap: 64px;
      }
      .cl-item {
        break-inside: avoid;
        margin-bottom: 24px;
      }
      .cl-item h3 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .cl-item ul {
        margin: 0;
        padding-left: 16px;
      }
      .cl-item li {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.8;
      }
      .privacy-link {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        text-align: left;
        font-size: 12px;
      }
      .privacy-link a {
        color: var(--muted);
        text-decoration: none;
      }
      .privacy-link a:hover {
        color: var(--ink);
      }
      .modal-mask {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .modal-mask.open {
        display: flex;
      }
      .modal {
        width: min(320px, 88vw);
        background: #1a1a1a;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 26px 24px 20px;
        text-align: center;
      }
      .modal p {
        margin: 0 0 18px;
        font-size: 13px;
        line-height: 1.9;
        color: var(--ink);
      }
      .modal a {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .modal button {
        font: inherit;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 11px 0;
        font-size: 13px;
        font-weight: 600;
        background: #f5f5f5;
        color: #111;
        cursor: pointer;
      }
      .modal button:hover {
        opacity: 0.82;
      }
      @media (max-width: 760px) {
        body {
          padding: 40px 20px;
        }
        #cl-list {
          columns: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img class="logo" src="./icon.png" alt="" />
        <div class="brand-copy">
          <h1>G-Line</h1>
          <p class="lead">一件一件，慢慢实现</p>
        </div>
      </div>
      <div class="stats">
        <div>
          <b>macOS</b>
          <span>12+ · universal</span>
        </div>
        <div>
          <b>Win64</b>
          <span>x64</span>
        </div>
        <div>
          <b id="ver">2026.9.11</b>
          <span>version</span>
        </div>
      </div>
      <div class="btn-row">
        <a class="btn" href="./G-Line.dmg" download="G-Line.dmg">下载 macOS 安装包</a>
        <a class="btn btn-win" href="./G-Line-win64.exe" download="G-Line-win64.exe">下载 Windows 64 位</a>
      </div>
      <section class="changelog">
        <h2 class="cl-title">更新日志</h2>
        <div id="cl-list"></div>
      </section>
      <p class="privacy-link"><a href="./privacy.html">隐私说明</a></p>
      <p class="privacy-link" style="margin-top:8px;padding-top:0;border-top:0"><a href="#" id="contact-open">合作联系</a></p>
      <div class="modal-mask" id="contact-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-label="合作联系">
          <p>有合作意向，请发送邮件到 <a href="mailto:panggu999@yeah.net">panggu999@yeah.net</a></p>
          <button type="button" id="contact-ok">确认</button>
        </div>
      </div>
    </main>
    <script>
      fetch("./version.json", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((v) => {
          if (!v || !v.version) return;
          document.getElementById("ver").textContent = v.version;
        })
        .catch(() => {});
      fetch("./changelog.json", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          const list = (data && data.releases) || [];
          if (!list.length) return;
          const box = document.getElementById("cl-list");
          for (const rel of list) {
            const item = document.createElement("div");
            item.className = "cl-item";
            const h = document.createElement("h3");
            h.textContent = rel.version;
            const ul = document.createElement("ul");
            for (const note of rel.notes || []) {
              const li = document.createElement("li");
              li.textContent = note;
              ul.appendChild(li);
            }
            item.appendChild(h);
            item.appendChild(ul);
            box.appendChild(item);
          }
        })
        .catch(() => {});
      (function () {
        var modal = document.getElementById("contact-modal");
        var ok = document.getElementById("contact-ok");
        function close() {
          modal.classList.remove("open");
        }
        document.getElementById("contact-open").addEventListener("click", function (e) {
          e.preventDefault();
          modal.classList.add("open");
          ok.focus();
        });
        ok.addEventListener("click", close);
        document.addEventListener("keydown", function (e) {
          if (!modal.classList.contains("open")) return;
          if (e.key === "Escape" || e.key === "Enter") {
            e.preventDefault();
            close();
          }
        });
      })();
    </script>
  </body>
</html>
