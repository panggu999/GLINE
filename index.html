<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G-Line</title>
    <meta name="description" content="G-Line · 每日事项工具 · macOS 通用安装包" />
    <link rel="icon" href="./icon.png" type="image/png" />
    <style>
      :root {
        --bg: #111111;
        --ink: #f5f5f5;
        --muted: #8e8e8e;
        --line: #2a2a2a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", "Hiragino Sans GB", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 72px 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin: 0 0 36px;
        text-align: left;
      }
      .logo {
        display: block;
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }
      .brand-copy {
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
          "Songti SC", serif;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .lead {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        font-weight: 400;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        margin: 0 0 36px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stats b {
        display: block;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .stats span {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      a.btn {
        display: block;
        text-decoration: none;
        background: #f5f5f5;
        color: #111;
        border-radius: 10px;
        padding: 13px 18px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: opacity 0.15s ease;
      }
      a.btn:hover {
        opacity: 0.82;
      }
      .gate {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img class="logo" src="./icon.png" alt="" />
        <div class="brand-copy">
          <h1>G-Line</h1>
          <p class="lead">一件一件，慢慢实现</p>
        </div>
      </div>
      <div class="stats">
        <div>
          <b>macOS</b>
          <span>12+</span>
        </div>
        <div>
          <b>Universal</b>
          <span>arm · intel</span>
        </div>
        <div>
          <b id="ver">2026.8.24</b>
          <span>version</span>
        </div>
      </div>
      <a class="btn" href="./G-Line.dmg" download="G-Line.dmg">下载安装包</a>
      <p class="gate">第一次打开若被拦：系统设置 → 隐私与安全性，拉到最下面，点 G-Line 旁的「仍要打开」。</p>
    </main>
    <script>
      fetch("./version.json", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((v) => {
          if (!v || !v.version) return;
          document.getElementById("ver").textContent = v.version;
        })
        .catch(() => {});
    </script>
  </body>
</html>
